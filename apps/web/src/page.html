<title>LANES</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Pixelify+Sans:wght@500;600&display=swap">
<style>
/*
 * LANES in the Trucking Terminal skin: the same theme tokens and the same 34 themes
 * as the TMS (themes.css, inlined at build), a dense ops-console layout, and pixel
 * art for the world — the map, the trucks, the title scene — drawn at whole-number
 * scales so it stays crisp.
 */
:root {
  --font-jetbrains-mono: "JetBrains Mono"; --font-fira-code: "JetBrains Mono"; --font-source-code-pro: "JetBrains Mono"; --font-space-mono: "Space Mono";
  --font-ibm-plex-mono: "JetBrains Mono"; --font-roboto-mono: "JetBrains Mono"; --font-share-tech-mono: "JetBrains Mono";
  --font-inter: "Inter"; --font-rajdhani: "Inter"; --font-orbitron: "Space Mono"; --font-plus-jakarta-sans: "Inter"; --font-dm-sans: "Inter";
  --font-ibm-plex-sans: "Inter"; --font-playfair-display: "Inter"; --font-merriweather-sans: "Inter"; --font-exo-2: "Inter";
  --radius: 4px;
}
/*THEMES*/
:root { color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg-primary); color: var(--text-primary); font-family: var(--font-body); font-size: 13px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
img.px { image-rendering: pixelated; vertical-align: middle; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; line-height: 1.3; }
/* The menu system §1.1: display headings in Pixelify Sans; a figure inside one keeps its mono (.num), body Inter. */
h2, h3 { font-family: var(--font-display, inherit); font-weight: 600; letter-spacing: 0.02em; }
h2 { font-size: 15px; letter-spacing: 0.02em; }
h3 { font-size: 13px; }
p { margin: 0; }
.muted { color: var(--text-secondary); }
.dim { color: var(--text-dim); }
.small { font-size: 12px; }
.good { color: var(--accent-success); }
.bad { color: var(--accent-danger); }
.warn { color: var(--accent-warn); }
.accent { color: var(--accent); }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.stars { color: var(--accent-warn); letter-spacing: 1px; }
.label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.nobreak { white-space: nowrap; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 30px; padding: 4px 10px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-panel); color: var(--text-primary); font-family: var(--font-mono); font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; cursor: pointer; transition: background 0.1s, border-color 0.1s; }
.btn:hover { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--bg-panel)); }
.btn.primary, .btn.on { background: var(--accent); border-color: var(--accent); color: var(--text-on-accent); }
.btn.primary:hover, .btn.on:hover { background: color-mix(in srgb, var(--accent) 85%, white); }
.btn.danger { border-color: var(--accent-danger); color: var(--accent-danger); }
.btn.danger:hover { background: color-mix(in srgb, var(--accent-danger) 15%, var(--bg-panel)); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { border-color: var(--border); }
.btn.sm { min-height: 24px; padding: 2px 7px; font-size: 10px; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.btn[disabled]:hover { border-color: var(--border); background: var(--bg-panel); }
.btn.primary[disabled]:hover { background: var(--accent); }
.btn img.px { width: 16px; height: 16px; image-rendering: pixelated; }
/* The painted tab icons (assets/icons, tools/icons.sh): little paintings, so they scale smoothly. */
.btn img.tabpic { width: 28px; height: 28px; margin: -4px 0; image-rendering: auto; filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.5)); }
input[type=text], input[type=number], select { min-height: 30px; padding: 3px 8px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-input); color: var(--text-primary); min-width: 0; }
input[type=number] { width: 7em; font-family: var(--font-mono); }
input:focus, select:focus { border-color: var(--accent); outline: none; }
input[type=checkbox], input[type=radio] { accent-color: var(--accent); width: 15px; height: 15px; }
.field { display: grid; gap: 3px; }
.bar { display: inline-block; width: 90px; height: 6px; border: 1px solid var(--border); background: var(--bg-input); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.grow { flex: 1 1 auto; min-width: 0; }
table.mini tr.sel td { color: var(--accent); }
table.mini tbody tr { cursor: default; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: 3px; border: 1px solid var(--border); font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-secondary); white-space: nowrap; }
.badge.live { border-color: var(--accent-danger); color: var(--accent-danger); }
.badge.live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent-danger); }
/* The live badge blinks in Full motion only; Calm and Still show a steady dot (the menu system §2.6). */
html[data-motion="full"] .badge.live::before { animation: blink 2s steps(2, end) infinite; }
@keyframes blink { 50% { opacity: 0.25; } }
.badge.test { border-color: var(--accent-warn); color: var(--accent-warn); }
.badge.alert { background: var(--accent-danger); border-color: var(--accent-danger); color: #fff; }
.badge.good { border-color: var(--accent-success); color: var(--accent-success); }
.badge.warn { border-color: var(--accent-warn); color: var(--accent-warn); }

/* Cards and panels */
.card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.card.walk { border-color: var(--accent, var(--border)); }
.walkbody { display: flex; gap: 10px; align-items: flex-start; }
.card.walk .welcome { max-width: 100%; justify-self: center; image-rendering: pixelated; }
.walkbody .walktext { min-width: 0; flex: 1; display: grid; gap: 6px; }
.walkbody .portrait { flex: none; }
.portrait.placeholder { display: inline-grid; place-items: center; width: 64px; height: 64px; border-radius: 50%; background: var(--bg-secondary); border: 1px solid var(--border); font-family: var(--font-mono); font-size: 24px; color: var(--text-secondary); }
.card.report textarea { width: 100%; min-width: 0; box-sizing: border-box; font: inherit; background: var(--bg-secondary); color: inherit; border: 1px solid var(--border); border-radius: var(--radius); padding: 6px 8px; resize: vertical; }
.tabs .btn.locked { opacity: 0.75; }
.tabs .lock { font-size: 10px; margin-left: 2px; }
.card.alert { border-color: var(--accent-danger); box-shadow: inset 3px 0 0 var(--accent-danger); }
.card.sel { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.card.clickable { cursor: pointer; }
.card.clickable:hover { border-color: color-mix(in srgb, var(--accent) 60%, var(--border)); }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; margin: 0; }
.kv dt { color: var(--text-secondary); }
.kv dd { margin: 0; }
table { border-collapse: collapse; width: 100%; }
td, th { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); font-weight: 500; white-space: nowrap; }
th.sortable { cursor: pointer; }
th.sortable:hover, th.sorted { color: var(--accent); }
tr.you td { color: var(--accent); }
tbody tr.clickable { cursor: pointer; }
tbody tr.clickable:hover td { background: color-mix(in srgb, var(--accent) 6%, transparent); }
tbody tr.open td { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.truckhead { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; }
.truckhead img.px { width: 172px; height: auto; }
.truckhead img.rig { width: 320px; max-width: 100%; }
/* The truck card's stage (the menu system §3): its window, the rig laid along its foot; the rig rolls only on the road. */
.rigstage { position: relative; flex: none; width: 256px; max-width: 100%; }
.rigstage .window { height: auto; aspect-ratio: 16 / 9; }
.rigstage .window::after { display: none; }
.rigstage .rig { position: absolute; left: 0; right: 0; bottom: 4px; margin: 0 auto; max-width: 100%; }
.rigstage.parked .rig.loop { animation-play-state: paused; }
.rig { image-rendering: pixelated; }
/* A rig's cab repainted by hue: the cyan paint turns red, lime or grey; the white trailer keeps its colour. */
.paint-red { filter: hue-rotate(165deg) saturate(1.1); }
.paint-lime { filter: hue-rotate(-85deg); }
.paint-grey { filter: saturate(0.25); }
.portrait { width: 48px; height: 48px; image-rendering: pixelated; border-radius: var(--radius); background: var(--bg-input); border: 1px solid var(--border); }
.portrait.sm { width: 32px; height: 32px; }
.portrait.md { width: 64px; height: 64px; flex: none; }
.portrait.xl { width: 128px; height: 128px; flex: none; }
canvas.portrait { display: block; }
.scene { display: block; width: 512px; max-width: 100%; height: auto; image-rendering: pixelated; border: 1px solid var(--border); border-radius: var(--radius); margin: 0 auto; }
/* A painted loop: a strip of frames next to the page, stepped through by CSS (ui/Loop.tsx). */
.loop { display: block; background-repeat: no-repeat; background-position: 0 0; image-rendering: pixelated; animation-name: loop-play; animation-iteration-count: infinite; max-width: 100%; }
.loop.smooth, .still.smooth { image-rendering: auto; }
.loop.scene { aspect-ratio: 16 / 9; height: auto !important; background-size: calc(var(--n) * 100%) 100%; }
@keyframes loop-play { from { background-position-x: 0; } to { background-position-x: 100%; } }
/* The scene's sky: weather drawn over the loop (ui/Loop.tsx). */
.scenebox { position: relative; width: 512px; max-width: 100%; margin: 0 auto; }
.scenebox .loop, .scenebox .still { width: 100% !important; }
.scenebox canvas.sky { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; border-radius: var(--radius); image-rendering: pixelated; }
/*
 * Motion in the menus (the menu system §2, rule 4.3: one accent at a time): a primary button gleams once when it appears
 * and once on hover, the logo shines once; nothing loops forever on a screen being read. The live tab's breath, the
 * icon's bob and the ratings' twinkle are gone. Every rule keys on <html data-motion> (motion.ts): Full plays them,
 * Calm and Still don't.
 */
.btn { position: relative; overflow: hidden; }
.btn::after { content: ""; position: absolute; top: -40%; bottom: -40%; width: 30%; left: -60%; background: linear-gradient(100deg, transparent, color-mix(in srgb, white 35%, transparent), transparent); transform: skewX(-20deg); pointer-events: none; }
html[data-motion="full"] .btn.primary::after { animation: btn-gleam 600ms ease-in-out 1; }
html[data-motion="full"] .btn:hover::after { animation: btn-gleam-hover 600ms ease-in-out 1; }
@keyframes btn-gleam { 0% { left: -60%; } 100% { left: 130%; } }
@keyframes logo-gleam { 0% { left: -40%; } 100% { left: 130%; } }
@keyframes btn-gleam-hover { 0% { left: -60%; } 100% { left: 130%; } }
.stars { display: inline-block; letter-spacing: 1px; }
.topbar .logo, .logo.hd { height: 32px; width: auto; image-rendering: auto; position: relative; }
.logowrap { position: relative; display: inline-block; overflow: hidden; }
html[data-motion="full"] .logowrap::after { animation: logo-gleam 1.4s ease-in-out 600ms 1 both; }
.logowrap::after { content: ""; position: absolute; top: 0; bottom: 0; width: 24%; left: -40%; background: linear-gradient(100deg, transparent, color-mix(in srgb, white 55%, transparent), transparent); transform: skewX(-20deg);  pointer-events: none; mix-blend-mode: screen; }
/* The city pane: a hub's big painting over the map with the live sky on it and a slow drift so it never sits still, then its market in tabs. */
.cityview { position: absolute; inset: 0; z-index: 30; display: grid; place-items: center; padding: 14px; background: rgba(4, 10, 20, 0.62); animation: city-fade 0.2s ease-out; }
.citybox { width: min(100%, 1120px); max-height: 100%; display: flex; flex-direction: column; background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55); }
.citybox.town { width: min(100%, 980px); }
.citypic { position: relative; width: 100%; aspect-ratio: 688 / 384; max-height: 46vh; overflow: hidden; background: #1a1430; flex: none; }
.citypic img, .citypic canvas.pic, .citypic .citypending { position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; object-fit: cover; transform-origin: 50% 60%; animation: city-drift 36s ease-in-out infinite alternate; }
.citypic .citypending { display: grid; place-items: center; font: 700 28px/1 var(--font-mono); color: var(--text-secondary); animation: none; }
.citypic canvas.sky { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; image-rendering: pixelated; }
.citycap { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 14px; font-size: 18px; color: #fff; text-shadow: 0 1px 2px #000, 0 0 12px rgba(0, 0, 0, 0.8); background: linear-gradient(transparent, rgba(0, 0, 0, 0.55)); pointer-events: none; }
.citycap .muted { color: rgba(255, 255, 255, 0.8); }
.season-winter .citypic img { filter: saturate(0.62) brightness(1.08) contrast(0.95); }
.season-autumn .citypic img { filter: sepia(0.2) saturate(1.2); }
.season-spring .citypic img { filter: saturate(1.08) hue-rotate(-6deg); }
.citytabs { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); flex: none; }
.citytabs .grow { flex: 1; }
.citybody { padding: 10px 12px; overflow: auto; min-height: 0; }
.citygrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px; }
.citygrid .card { margin: 0; }
.small { font-size: 12px; margin-bottom: 6px; }
.sectorrow { display: grid; grid-template-columns: 1fr 110px auto; align-items: center; gap: 8px; margin: 4px 0; font-size: 13px; }
.sectorrow .num { font-family: var(--font-mono); white-space: nowrap; }
table.mini { width: 100%; border-collapse: collapse; font-size: 13px; }
table.mini th { text-align: left; color: var(--text-secondary); font-weight: 500; padding: 2px 6px 2px 0; }
table.mini td { padding: 2px 6px 2px 0; font-family: var(--font-mono); }
table.mini td:first-child { font-family: inherit; }
.seasons .seasonrow { display: grid; grid-template-columns: 200px 1fr; gap: 12px; align-items: center; margin: 10px 0; }
.seasonbars { display: flex; gap: 4px; }
.sbar { flex: 1; text-align: center; font-size: 11px; color: var(--text-secondary); }
.sbar .sbarbox { position: relative; height: 64px; border-radius: 3px; }
.sbar .sbarbox::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 1px solid var(--border); }
.sbar i { position: absolute; left: 15%; width: 70%; background: var(--accent-success); border-radius: 2px 2px 0 0; min-height: 2px; }
.sbar i.up { bottom: 50%; }
.sbar i.down { top: 50%; background: var(--accent-danger); border-radius: 0 0 2px 2px; }
.sbar.now span { color: var(--accent); font-weight: 700; }
.sbar.now .sbarbox { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.townhead { display: flex; gap: 16px; align-items: center; padding: 12px 14px 4px; }
.townhead .townpic { image-rendering: pixelated; flex: none; }
.townhead h2 { margin: 0 0 4px; font-size: 20px; }
.townhead .towntitle > div { margin-bottom: 6px; }
@keyframes city-drift { from { transform: scale(1); } to { transform: scale(1.06) translate(-1.2%, -1%); } }
@keyframes city-fade { from { opacity: 0; } }
/* Calm and Still: loops show their first frame, no drift, no gleam (the menu system §2.6). */
html:not([data-motion="full"]) :is(.loop, .citypic img, .citypic canvas.pic) { animation: none !important; }
html:not([data-motion="full"]) .btn::after, html:not([data-motion="full"]) .logowrap::after { animation: none !important; }
.spark { display: block; width: 100%; height: 48px; }
.guide h4 { margin-top: 6px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
.guide ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.guide p { margin: 0; }
.guidenav { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.guidenav .label { width: 100%; }

/* Shell */
#app { min-height: 100%; display: flex; flex-direction: column; }
/* The top strip (specs/first-ten-minutes.md): one 44 px row on every screen. */
.topbar { display: flex; align-items: center; gap: 10px; flex-wrap: nowrap; height: 44px; padding: 0 12px; padding-top: env(safe-area-inset-top); box-sizing: content-box; background: var(--bg-secondary); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
.topbar .grow { flex: 1; }
/* The menu system §1.7: the bar at dusk, a 1 px sun line at its foot; the cash on its own dark chip, a place for the
   money glow behind the figure (§2.4). */
.topbar { background: linear-gradient(var(--horizon-top, var(--bg-secondary)), var(--horizon-foot, var(--bg-secondary))); box-shadow: inset 0 -1px 0 var(--sun, var(--border)); }
.topbar .cash { padding: 2px 8px; border-radius: var(--radius); background: var(--bg-input); box-shadow: 0 0 0 1px color-mix(in srgb, var(--sun, var(--border)) 30%, transparent); }
.econwrap { overflow-x: auto; }
.econ { width: 100%; border-collapse: collapse; font-size: 13px; }
.econ th, .econ td { padding: 2px 6px; text-align: right; white-space: nowrap; }
.econ th:first-child, .econ td:first-child { text-align: left; white-space: normal; }
.watchbar { padding: 6px 12px; font-size: 13px; background: var(--bg-secondary); border-bottom: 1px solid var(--border); border-left: 4px solid var(--accent-warn); position: sticky; top: calc(44px + env(safe-area-inset-top)); z-index: 9; }
.topbar .cash { font-family: var(--font-mono); font-size: 14px; font-weight: 600; white-space: nowrap; }
/* Finance's option rows (specs/finance.md): each a selectable row, the current one marked; dimmed and inert on the lessor's truck. */
.optrows { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; }
.optrow { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-height: 44px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; background: none; color: var(--text-primary); font: inherit; text-align: left; cursor: pointer; }
.optrow.on { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.optrows.dim .optrow { opacity: .55; cursor: default; }
.bighead { font-size: 15px; line-height: 1.35; margin: 4px 0 6px; }
.lookbtn { padding: 4px; border: 2px solid var(--border); border-radius: 8px; background: none; cursor: pointer; line-height: 0; }
.lookbtn.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.linkrow { display: block; padding: 6px 0; border: 0; background: none; color: var(--accent); font: inherit; font-size: 13px; text-align: left; cursor: pointer; }
.intelrows { display: flex; flex-direction: column; }
.intelrow { display: flex; flex-direction: column; justify-content: center; gap: 2px; min-height: 64px; padding: 6px 4px; border: 0; border-bottom: 1px solid var(--border); background: none; color: var(--text-primary); font: inherit; text-align: left; cursor: pointer; }
.intelrow.you { background: var(--bg-secondary); }
.intelrow .chip { margin-left: 6px; }
.intelfind { width: 100%; }
.chips { flex-wrap: wrap; }
.amberdot { display: inline-block; width: 8px; height: 8px; margin-left: 6px; border-radius: 50%; background: var(--accent-warn); vertical-align: middle; }
.caption.whatnow .stack { gap: 4px; }
.fig { display: inline-flex; align-items: center; min-height: 44px; margin: -12px 0; padding: 0 4px; border: 0; background: none; color: inherit; font: inherit; text-decoration: underline dotted; text-decoration-color: color-mix(in srgb, currentColor 50%, transparent); text-underline-offset: 3px; cursor: pointer; }
/* Batch M1 (the player's pass): in a key-value row a figure may wrap (a long "Ready since …"), so it takes its own
   height there instead of borrowing 12 px above and below, which laid its second line over the next row. */
.kv dd .fig { margin: 0; min-height: 28px; padding: 2px 0; text-align: left; }
.figon { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.explainsheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; max-height: 60vh; overflow: hidden; padding: 4px 16px 0; background: var(--bg-panel); border-top: 1px solid var(--border); box-shadow: 0 -8px 24px rgba(0,0,0,.45); display: flex; flex-direction: column; gap: 6px; }
/* The tap-outside layer: transparent, so the outlined figure stays readable; on a phone it stops above the nav. */
.explainscrim { position: fixed; inset: 0; z-index: 59; background: transparent; }
.explainhead { flex: none; touch-action: none; display: flex; flex-direction: column; gap: 4px; }
.explainhead .grab { align-self: center; width: 36px; height: 4px; border-radius: 2px; background: var(--border); margin: 4px 0 2px; }
.explainhead > .row { flex-wrap: nowrap; align-items: flex-start; }
/* R6: a truck card's secondary actions under ⋯ on a phone, a 44 px target. */
.overflow > summary { list-style: none; display: inline-flex; align-items: center; justify-content: center; min-width: 44px; min-height: 44px; border: 1px solid var(--border); border-radius: 4px; cursor: pointer; }
.overflow > summary::-webkit-details-marker { display: none; }
.overflow[open] { flex-basis: 100%; }
.explainhead .grow { min-width: 0; }
.explainnow { padding: 6px 0; border-top: 1px solid var(--border); }
.explainx { flex: none; width: 44px; height: 44px; border: 0; background: none; color: var(--text-secondary); font-size: 24px; cursor: pointer; }
.explainbody { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
.explainfoot { flex: none; min-height: 56px; align-items: center; border-top: 1px solid var(--border); }
.explainsheet .explainrows { display: grid; gap: 4px; }
.explainsheet .kvrow > :last-child { white-space: nowrap; }
.explainsheet .kvrow { display: flex; justify-content: space-between; gap: 12px; }
/* The laptop's card opens in the bottom corner away from its figure (guidance-ux.md section 3): bottom-left over the map
   for a figure in the panel, bottom-right for one on the map side. */
@media (min-width: 900px) {
  /* The four main tabs never scroll out of sight on a laptop (the gamer's diary): the nav stays at the top as the page
     scrolls, under the sticky top strip (44 px and its border), not beneath it (QA, client pass 2: the page scrolled
     148 px and the tabs slid under the test-speed buttons). A wheel past the panel's end no longer scrolls the page. */
  .side > .rackbar { position: sticky; top: calc(45px + env(safe-area-inset-top)); z-index: 4; background: var(--bg-primary); }
  .panelbox { overscroll-behavior: contain; }
  .explainsheet { left: auto; right: 16px; bottom: 16px; width: 320px; border: 1px solid var(--border); border-radius: 8px; }
  .explainsheet.left { left: 16px; right: auto; }
}
.needswrap { position: relative; display: inline-flex; }
/* The company switch (brokerage-ux.md section 1): the chip's ring and the strip's under-line in the company's colour. */
.coswitch { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 8px 0 2px; border: 2px solid var(--co); border-radius: 18px; background: none; color: var(--text-primary); font: inherit; font-size: 13px; cursor: pointer; }
.coswitch img.px { width: 32px; height: 32px; }
.co-carrier { --co: var(--accent); }
.co-brokerage { --co: var(--accent-warn); }
.topbar.co-carrier, .topbar.co-brokerage { border-bottom: 3px solid var(--co); }
.needslist { position: fixed; top: 50px; left: 16px; z-index: 40; display: flex; flex-direction: column; width: min(360px, calc(100vw - 32px)); background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.45); overflow: hidden; }
.needslist { max-height: 70vh; overflow-y: auto; }
.needrow { display: flex; align-items: center; gap: 8px; padding: 4px 8px 4px 12px; border-bottom: 1px solid var(--border); }
.needrow:last-child { border-bottom: 0; }
.needrow .needline { flex: 1; min-width: 0; min-height: 44px; padding: 4px 0; border: 0; background: none; color: var(--text-primary); font: inherit; font-size: 13px; text-align: left; cursor: pointer; }
.needrow .needact { flex: none; min-height: 44px; white-space: nowrap; }
.flash { animation: needflash 1.2s ease-out 1; }
@keyframes needflash { 0%, 30% { box-shadow: 0 0 0 3px var(--accent-danger); } 100% { box-shadow: 0 0 0 0 transparent; } }
html:not([data-motion="full"]) .flash { animation: none; outline: 2px solid var(--accent-danger); }
.alertdot { min-width: 24px; height: 24px; padding: 0 6px; border-radius: 12px; border: 0; background: var(--accent-danger); color: #fff; font-family: var(--font-mono); font-size: 12px; font-weight: 700; cursor: pointer; }
.menudd { position: relative; }
.menudd > summary { list-style: none; font-size: 16px; min-width: 36px; }
.menudd > summary::-webkit-details-marker { display: none; }
.menudd-list { position: absolute; right: 0; top: calc(100% + 4px); z-index: 30; display: grid; min-width: 220px; background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 8px 24px rgba(0,0,0,0.35); }
.menudd-list button { text-align: left; padding: 12px 14px; border: 0; border-bottom: 1px solid var(--border); background: transparent; cursor: pointer; }
.menudd-list button:last-child { border-bottom: 0; }
.menudd-list button:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
/*
 * The painted frames and buttons (the menu system §1.2–1.6, step 3). kitcss.ts cuts each nine-slice piece out of the
 * kit atlas into a custom property and sets html[data-kit] once they're in; until then, and wherever the kit is
 * missing, today's 1 px borders stand. The rims lie 4 px outside the box (outset), over the gap between cards, so no
 * line moves when the art decodes; a frame's interior is the CSS token, never a painting. Pixel art at 1 source px per
 * CSS px.
 */
html[data-kit] :is(.card, .loadcard, .toast, .citybox, .menudd-list, .confirmsheet) { image-rendering: pixelated; border-color: transparent; }
html[data-kit] .card { border-image: var(--frame-card) var(--frame-card-slice) / var(--frame-card-width) / 4px stretch; }
html[data-kit] .loadcard { border-image: var(--frame-ticket) var(--frame-ticket-slice) / var(--frame-ticket-width) / 4px stretch; }
html[data-kit] .loadcard.blocked { filter: grayscale(0.7); }
html[data-kit] .toast { border-image: var(--frame-toast) var(--frame-toast-slice) / var(--frame-toast-width) / 4px stretch; }
html[data-kit] :is(.citybox, .menudd-list) { border-image: var(--frame-panel) var(--frame-panel-slice) / var(--frame-panel-width) / 4px stretch; }
html[data-kit] .confirmsheet { border-image: var(--frame-dialog) var(--frame-dialog-slice) / var(--frame-dialog-width) / 4px stretch; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55); }
/* Receipts and the month report: the one light surface (§1.4), paper with ink; the tokens turn to ink inside it. */
:is(.delivered, .monthcard) { --text-primary: var(--ink); --text-secondary: #4f3e52; --text-dim: #66546a; --accent: #1d6b60; --accent-success: var(--ink-green); --accent-danger: var(--ink-red); --accent-warn: #8a4b06; --border: #c9b79f; --bg-input: #e8d9c2; background: var(--paper); color: var(--ink); }
html[data-kit] :is(.delivered, .monthcard) { image-rendering: pixelated; border-color: transparent; border-image: var(--frame-paper) var(--frame-paper-slice) / var(--frame-paper-width) / 4px stretch; }
/* Buttons (§2.3): the painted enamel, its face stretched (fill); pressed at once, no shrink; disabled desaturated. Tabs,
   segments and ghost buttons stay code. */
html[data-kit] .btn:where(:not(.ghost, .tabs .btn, .seg .btn, .speeds .btn)) { image-rendering: pixelated; border-color: transparent; background: transparent; border-image: var(--button-secondary) var(--button-secondary-slice) fill / var(--button-secondary-width) / 0 stretch; }
html[data-kit] .btn:where(:not(.ghost, .tabs .btn, .seg .btn, .speeds .btn)):active { border-image-source: var(--button-secondary-press); }
html[data-kit] .btn.primary:where(:not(.ghost, .tabs .btn, .seg .btn, .speeds .btn)) { border-image: var(--button-primary) var(--button-primary-slice) fill / var(--button-primary-width) / 0 stretch; }
html[data-kit] .btn.primary:where(:not(.ghost, .tabs .btn, .seg .btn, .speeds .btn)):active { border-image-source: var(--button-primary-press); }
html[data-kit] .btn.danger:where(:not(.ghost, .tabs .btn, .seg .btn, .speeds .btn)) { color: var(--text-primary); border-image: var(--button-danger) var(--button-danger-slice) fill / var(--button-danger-width) / 0 stretch; }
html[data-kit] .btn.danger:where(:not(.ghost, .tabs .btn, .seg .btn, .speeds .btn)):active { border-image-source: var(--button-danger-press); }
.btn[disabled] { filter: saturate(0.3); opacity: 0.5; }
/* The kit's icons (ui/KitIcon.tsx): smooth from 96 px; the active phone tab plays its lit loop once and rests lit. */
.kicon { display: inline-block; flex: none; background-repeat: no-repeat; image-rendering: auto; vertical-align: middle; }
html[data-motion="full"] .kicon.lit { animation: kit-lit var(--lit-ms, 625ms) steps(var(--lit-steps, 4), end) 1 forwards; }
@keyframes kit-lit { from { background-position-x: var(--lit-x0); } to { background-position-x: var(--lit-x1); } }
/*
 * A screen's window (the menu system §1.3, ui/Window.tsx): a slice of its scene above the panel's title, 72 px on a
 * phone and 96 on a laptop, hidden at the sheet's strip height. Its box is there before the art (the average colour);
 * the painting fades in over 160 ms; a 16 px fade at its foot into the panel, so no text sits on the painting. The loop
 * steps by CSS over the still (no JavaScript per frame).
 */
.window { position: relative; flex: none; width: 100%; height: 96px; overflow: hidden; border-radius: var(--radius); }
.window canvas { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 160ms var(--ease-out, ease-out); image-rendering: pixelated; }
.window canvas.ready { opacity: 1; }
.window .winloop { position: absolute; inset: 0; background-repeat: no-repeat; background-position-x: var(--x0); image-rendering: pixelated; }
html[data-motion="full"] .window .winloop { animation-name: win-loop; animation-iteration-count: infinite; }
@keyframes win-loop { from { background-position-x: var(--x0); } to { background-position-x: calc(var(--x0) - var(--sheetw)); } }
.monthcard .window::after { background: linear-gradient(transparent, var(--paper)); }
.dockclock { flex: none; image-rendering: auto; }
.window::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 16px; background: linear-gradient(transparent, var(--bg-panel)); pointer-events: none; }
:root { --t-quick: 120ms; --t-enter: 220ms; --t-sheet: 280ms; --t-morph: 300ms; --t-flight: 520ms; --ease-out: cubic-bezier(.2,.8,.2,1); --ease-in: cubic-bezier(.4,0,1,1); --ease-in-out: cubic-bezier(.45,0,.25,1); --ease-snap: cubic-bezier(.3,1.25,.5,1); }
/*
 * The stamps (the menu system §2.3, ui/Stamp.tsx): the kit's ink ring with the word over it, in a corner clear of
 * every figure. Red for the player's own acts, green WON, grey LOST (the ring tinted by filter). Full: lands with scale
 * 1.25 → 1 over 160 ms, then the dust; Calm: a 120 ms fade; Still: there.
 */
.stamped { position: relative; }
.stamp { position: absolute; top: -6px; left: -6px; z-index: 2; display: grid; place-items: center; pointer-events: none; border-radius: 50%; background-repeat: no-repeat; image-rendering: auto; transform: rotate(-12deg); }
.stamp:not(.painted) { border: 3px double currentColor; }
/* Batch M1: a stamp in a card's head or at the end of a line sits in the flow, beside the words, never over one. */
.stamp.inline { position: relative; top: auto; left: auto; display: inline-grid; vertical-align: middle; margin: -12px 0 -12px 6px; }
.stamp.inline .stampword { font-size: 10px; }
.stamp.waiting { visibility: hidden; }
.stamp .stampword { font: 600 13px/1 var(--font-display, var(--font-mono)); letter-spacing: 0.04em; }
.stamp.ink-red { color: #c4363a; }
.stamp.ink-green { color: #2e9a52; filter: hue-rotate(120deg) saturate(0.9); }
.stamp.ink-green .stampword { filter: hue-rotate(-120deg); }
.stamp.ink-grey { color: #8f8696; filter: grayscale(1); }
html[data-motion="full"] .stamp.landing { animation: stamp-land 160ms var(--ease-snap) both; }
html[data-motion="calm"] .stamp.landing { animation: stamp-fade 120ms ease-out both; }
@keyframes stamp-land { from { transform: rotate(-12deg) scale(1.25); opacity: 0.4; } to { transform: rotate(-12deg) scale(1); opacity: 1; } }
@keyframes stamp-fade { from { opacity: 0; } }
.stampdust { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; background-repeat: no-repeat; background-position: var(--dust-x) var(--dust-y); image-rendering: pixelated; animation: stamp-dust 500ms steps(6) 160ms 1 both; }
@keyframes stamp-dust { from { background-position-x: var(--dust-x); } to { background-position-x: var(--dust-run); } }
/* Money (§2.4): the spark's flight, the cash chip's glow (Full) or steady ring (Calm, Still), the cost chip under it. */
.spark-fx { position: fixed; z-index: 90; pointer-events: none; background-repeat: no-repeat; image-rendering: pixelated; animation: spark-run 520ms steps(8) 1; }
@keyframes spark-run { from { background-position-x: var(--spark-x); } to { background-position-x: var(--spark-run); } }
.topbar .cash.cashglow { animation: cash-glow 600ms var(--ease-out) 1; }
@keyframes cash-glow { 0%, 100% { box-shadow: 0 0 0 1px color-mix(in srgb, var(--sun) 30%, transparent); } 50% { box-shadow: 0 0 12px 2px var(--sun); } }
.topbar .cash.cashring { box-shadow: 0 0 0 2px var(--sun); }
.cashwrap { position: relative; display: inline-flex; }
.costchip { position: absolute; top: calc(100% + 6px); right: 0; z-index: 25; white-space: nowrap; padding: 3px 8px; border-radius: var(--radius); background: var(--bg-input); border: 1px solid var(--border); font: 600 12px/1.3 var(--font-mono); color: var(--accent-danger); cursor: pointer; animation: chip-out 300ms ease-in 1600ms 1 forwards; }
@keyframes chip-out { to { opacity: 0; } }
.invoicerow.fresh { animation: row-fresh 1.2s ease-out 1; }
@keyframes row-fresh { from { background: color-mix(in srgb, var(--sun) 20%, transparent); } to { background: transparent; } }
.newpill { align-self: center; padding: 4px 12px; border-radius: 14px; border: 1px solid var(--sun); background: var(--bg-input); color: var(--text-primary); font-size: 12px; cursor: pointer; }
/* Hero moments (the menu system §1.3, §2.2): a 16:9 painting over a 60% dimmed screen, fading in; tap or OK to close. */
.window.hero { height: auto; aspect-ratio: 16 / 9; }
/* Batch M1, M2: on the laptop's load sheet the facility's hero shows at a window's height, not a full 16:9, so the
   sheet's route, its deadline and the dock clock stay in view above the pinned Book and Bid row (QA at 1280 × 800). */
.panelbox .window.hero { aspect-ratio: auto; height: 96px; }
.window.crop { width: 64px; height: 36px; }
.window.tint-winter canvas { filter: saturate(0.62) brightness(1.08) contrast(0.95); }
.window.tint-autumn canvas { filter: sepia(0.2) saturate(1.2); }
.window.tint-spring canvas { filter: saturate(1.08) hue-rotate(-6deg); }
.window.crop::after { display: none; }
.atlascell { width: 100%; background-repeat: no-repeat; image-rendering: pixelated; border-radius: var(--radius); }
.heroscrim { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: 16px; background: rgba(10, 6, 14, 0.6); animation: hero-in 300ms var(--ease-out) both; }
.herocard { width: min(640px, 100%); display: grid; gap: 10px; padding: 12px; background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55); }
html[data-kit] .herocard { image-rendering: pixelated; border-color: transparent; border-image: var(--frame-dialog) var(--frame-dialog-slice) / var(--frame-dialog-width) / 4px stretch; }
@keyframes hero-in { from { opacity: 0; } }
/* The Motion setting in the ≡ menu (the menu system §2.6): a label, three segments, a line of help. */
.motionset { display: grid; gap: 6px; padding: 10px 14px 12px; border-bottom: 1px solid var(--border); max-width: 280px; }
.motionset .seg { display: flex; gap: 4px; }
.menudd-list .motionset .btn { flex: 1 1 0; padding: 4px 6px; border: 1px solid var(--border); border-bottom: 1px solid var(--border); text-align: center; }
.menudd-list .motionset .btn.on { background: var(--accent); color: var(--text-on-accent); border-color: var(--accent); }
.brand { display: flex; align-items: center; gap: 10px; }
.brand img.px { height: 30px; width: auto; }
.brand .sub { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; color: var(--text-dim); text-transform: uppercase; }
.clock { font-family: var(--font-mono); font-size: 15px; font-weight: 600; color: var(--accent); white-space: nowrap; }
.speeds { display: flex; gap: 3px; }
.speeds .btn { min-width: 34px; padding: 3px 5px; }
/* Client batch 8b item 13 (the exploit hunter: "PAUSED looked greyed out", and twice it seemed paused when it wasn't):
   the speed in force is steady and marked, never breathing like a live tab, and the others read as plain choices. */
.speeds .btn.on { animation: none; box-shadow: inset 0 0 0 2px var(--text-on-accent); }
.speeds .btn.on::before { content: "● "; }
.stats { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-left: auto; }
.stat { display: inline-flex; gap: 6px; align-items: center; font-family: var(--font-mono); font-size: 13px; white-space: nowrap; }
.stat img.px { width: 20px; height: 20px; }
.board { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 10px; padding: 10px 12px; align-items: start; flex: 1; }
.board.panel { grid-template-columns: minmax(0, 1fr); }
.board.map { grid-template-columns: minmax(0, 1fr); }
.mapwrap { position: relative; height: clamp(360px, calc(100vh - 140px), 1100px); border: 1px solid var(--border); border-radius: var(--radius); background: #112640; overflow: hidden; }
.board.map .mapwrap { height: calc(100vh - 110px); }
#map { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
.mapzoom { position: absolute; right: 8px; top: 8px; z-index: 2; display: flex; gap: 3px; align-items: center; background: color-mix(in srgb, var(--bg-secondary) 85%, transparent); border: 1px solid var(--border); border-radius: var(--radius); padding: 3px; }
.mapzoom .label { min-width: 2.6em; text-align: center; }
#tip { position: absolute; z-index: 3; pointer-events: none; background: var(--bg-secondary); border: 1px solid var(--accent); border-radius: var(--radius); padding: 3px 7px; font-size: 12px; white-space: nowrap; }
.maplegend { position: absolute; left: 8px; bottom: 8px; z-index: 2; display: flex; gap: 12px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.04em; color: var(--text-secondary); background: color-mix(in srgb, var(--bg-secondary) 85%, transparent); border: 1px solid var(--border); border-radius: var(--radius); padding: 5px 8px; }
.dot { display: inline-block; width: 8px; height: 8px; margin-right: 5px; vertical-align: middle; border: 2px solid #090c17; }
.side { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.rackbar { display: flex; gap: 6px; align-items: center; }
.tabs { display: flex; gap: 2px; flex: 1; border-bottom: 1px solid var(--border); }
.tabs .btn { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: transparent; padding: 6px 8px; flex: 1 1 84px; flex-direction: column; gap: 2px; min-height: 48px; }
.tabs .navdot { position: absolute; top: 6px; right: calc(50% - 18px); width: 8px; height: 8px; border-radius: 50%; background: var(--accent-warn); }
.teaserbar { display: flex; flex-wrap: wrap; gap: 4px; }
.teaserseg { height: 32px; padding: 0 10px; border: 1px dashed var(--border); border-radius: var(--radius); background: transparent; color: var(--text-secondary); opacity: 0.6; font-family: var(--font-mono); font-size: 11px; cursor: pointer; }
.teaserseg.on, .teaserseg:hover { opacity: 1; border-color: var(--accent); }
.caption { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-height: 40px; }
.caption .small { flex: 1 1 200px; min-width: 0; }
.caption .portrait.sm, .caption .portrait.placeholder.sm { width: 32px; height: 32px; flex: none; font-size: 14px; }
.caption.iuliia { align-items: flex-start; }
.caption.heldline { position: relative; padding-right: 44px; }
.caption .capx { position: absolute; top: 0; right: 0; min-width: 44px; min-height: 44px; font-size: 18px; line-height: 1; }
/* QA item 8: a held line's stack is a column, so the row rule's flex-basis made each line 200 px tall (584 px on a phone). */
.caption > .stack { flex: 1 1 200px; min-width: 0; gap: 4px; }
.caption > .stack > .small { flex: none; }
.books { width: 100%; border-collapse: collapse; font-size: 13px; }
.books td { padding: 3px 0; vertical-align: top; }
.books td.num { text-align: right; white-space: nowrap; padding-left: 12px; }
.books tr.head td { padding-top: 10px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-secondary); }
.books tr.strong td { font-weight: 700; border-top: 1px solid var(--border); }
.returncard .linkish { background: none; border: 0; padding: 0 2px; min-height: 32px; color: var(--accent); font: inherit; cursor: pointer; text-decoration: underline; }
.returncard .stripline { display: none; }
.sheet.strip .returncard .stripline { display: inline-flex; align-items: center; }
.sheet.strip .returncard .full, .sheet.strip .returncard .portrait { display: none; }
.movebtn { display: inline-flex; flex-direction: column; align-items: flex-start; gap: 2px; max-width: 100%; }
.movebtn .fig { max-width: 100%; }
.movebtn .price { display: block; color: var(--text-secondary); font-size: 12px; white-space: nowrap; }
.moneyevents { list-style: none; margin: 0 0 6px; padding: 0; }
.moneyevents li { padding: 2px 0; }
/* QA item 8: a Fig is an inline flex box, so a money event's three parts became three columns on a narrow card. One line
   of text that wraps, the whole line the tap target, and the figure never split. */
.moneyevents .fig { display: block; width: 100%; min-height: 44px; margin: 0; padding: 4px 0; text-align: left; }
.moneyevents .fig .num { white-space: nowrap; }
.caption.iuliia .portrait.lg { width: 96px; height: 96px; flex: none; }
/* R21: the return card's rows take the width beside her portrait, not a word-wide column. */
.returncard > .stack { flex: 1 1 200px; min-width: 0; gap: 4px; }
.returncard > .stack > .small { flex: none; }
.poachrow { gap: 4px; padding: 8px 0; border-top: 1px solid var(--border); min-width: 0; }
.poachrow select { max-width: 100%; }
.switchrow { gap: 10px; min-height: 44px; cursor: pointer; flex-wrap: nowrap; }
.switchrow input { flex: none; width: 40px; height: 22px; accent-color: var(--accent); }
.morelist { display: grid; border: 1px solid var(--border); border-radius: var(--radius); }
.morerow { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 12px; border: 0; border-bottom: 1px solid var(--border); background: var(--bg-panel); text-align: left; cursor: pointer; }
.morerow:last-child { border-bottom: 0; }
.morerow:hover { background: color-mix(in srgb, var(--accent) 8%, var(--bg-panel)); }
.morerow span:nth-of-type(1) { flex: 1; }
.morerow .chev { color: var(--text-dim); }
.newdot { padding: 1px 6px; border-radius: 8px; background: var(--accent-warn); color: #000; font-size: 10px; font-weight: 700; }
.teaserrow { display: grid; gap: 8px; }
.teaserhead { display: flex; gap: 10px; align-items: center; }
.teaserhead h3 { margin: 0; }
